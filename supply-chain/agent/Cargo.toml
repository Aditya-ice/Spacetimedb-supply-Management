[package]
name = "agent"
version = "0.1.0"
edition = "2021"

[dependencies]
# This tells the agent how to use the code from your library crate.
spacetime-module = { path = "../module" }

# Native dependencies for the agent
spacetimedb-sdk = "1.3.2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive", "serde_derive"] }
serde_json = "1.0"